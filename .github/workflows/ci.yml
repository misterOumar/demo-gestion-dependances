# Étape 3 « Vérifier » : chaque PR, y compris celles de Dependabot, passe par la CI
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
